type Query
  @join__type(graph: GRAPH_SERVICE)
  @join__type(graph: SERVICE_ADMIN)
  @join__type(graph: SERVICE_ADMINUSER)
  @join__type(graph: SERVICE_AOM_AGREGATOR)
  @join__type(graph: SERVICE_AUTH)
  @join__type(graph: SERVICE_NOTIFICATIONS)
  @join__type(graph: SERVICE_USER)
{
  computeRoute(fromLat: Float!, fromLon: Float!, toLat: Float!, toLon: Float!): ComputedRoute @join__field(graph: GRAPH_SERVICE)
  infoTrafic(fromLat: Float!, fromLon: Float!, toLat: Float!, toLon: Float!): TrafficInfoDTO! @join__field(graph: GRAPH_SERVICE)
  getItineraireFromTo(request: RouteRequestDTO!, frictionUpdates: [FrictionUpdateDTO!] = null): ItineraryResultDTO @join__field(graph: GRAPH_SERVICE)
  searchTransitNetworksDatasets(fournisseurId: String!): [StandardDatasets!]! @join__field(graph: SERVICE_ADMIN)
  getRegistredTransitNetworks(actualPage: Int! = 1, limit: Int! = 10, offset: Int! = 0): PaginatedTransitNetworks! @join__field(graph: SERVICE_ADMIN)
  adminUsers: [AdminUser!]! @join__field(graph: SERVICE_ADMINUSER)
  adminUser(id: ID!): AdminUser @join__field(graph: SERVICE_ADMINUSER)
  byEmailAndPassword(email: String!, password: String!): AdminUser @join__field(graph: SERVICE_ADMINUSER)
  stopsNearby(lat: Float!, lon: Float!, radiusMeters: Int! = 500, first: Int! = 20, networkId: ID = null): [Stop!]! @join__field(graph: SERVICE_AOM_AGREGATOR)
  stop(id: ID!): Stop @join__field(graph: SERVICE_AOM_AGREGATOR)
  routes(networkId: ID = null, page: Int! = 1, pageSize: Int! = 25): PaginatedRoutes! @join__field(graph: SERVICE_AOM_AGREGATOR)
  route(id: ID!): Route @join__field(graph: SERVICE_AOM_AGREGATOR)
  status: String! @join__field(graph: SERVICE_AOM_AGREGATOR)
  transitGraph(networkId: ID!, departureTime: DateTime!, bbox: BoundingBoxInput = null): TransitGraph! @join__field(graph: SERVICE_AOM_AGREGATOR)
  getAllNotifications: [Notification]! @join__field(graph: SERVICE_NOTIFICATIONS)
  getMe: GetUserResponse! @join__field(graph: SERVICE_USER)
  getOne: GetUserResponse! @inaccessible @join__field(graph: SERVICE_USER)
  findAll: [GetUserResponse!]! @join__field(graph: SERVICE_USER)
  findOne(googleId: String!): GetUserResponse! @join__field(graph: SERVICE_USER)
}

