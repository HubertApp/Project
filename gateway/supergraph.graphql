schema
  @link(url: "https://specs.apollo.dev/link/v1.0")
  @link(url: "https://specs.apollo.dev/join/v0.5", for: EXECUTION)
  @link(url: "https://specs.apollo.dev/inaccessible/v0.2", for: SECURITY)
{
  query: Query
  mutation: Mutation
}

directive @inaccessible on FIELD_DEFINITION | OBJECT | INTERFACE | UNION | ARGUMENT_DEFINITION | SCALAR | ENUM | ENUM_VALUE | INPUT_OBJECT | INPUT_FIELD_DEFINITION

directive @join__directive(graphs: [join__Graph!], name: String!, args: join__DirectiveArguments) repeatable on SCHEMA | OBJECT | INTERFACE | FIELD_DEFINITION

directive @join__enumValue(graph: join__Graph!) repeatable on ENUM_VALUE

directive @join__field(graph: join__Graph, requires: join__FieldSet, provides: join__FieldSet, type: String, external: Boolean, override: String, usedOverridden: Boolean, overrideLabel: String, contextArguments: [join__ContextArgument!]) repeatable on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

directive @join__graph(name: String!, url: String!) on ENUM_VALUE

directive @join__implements(graph: join__Graph!, interface: String!) repeatable on OBJECT | INTERFACE

directive @join__type(graph: join__Graph!, key: join__FieldSet, extension: Boolean! = false, resolvable: Boolean! = true, isInterfaceObject: Boolean! = false) repeatable on OBJECT | INTERFACE | UNION | ENUM | INPUT_OBJECT | SCALAR

directive @join__unionMember(graph: join__Graph!, member: String!) repeatable on UNION

directive @link(url: String, as: String, for: link__Purpose, import: [link__Import]) repeatable on SCHEMA

type AdminUser
  @join__type(graph: SERVICE_ADMINUSER, key: "id")
{
  id: ID!
  firstname: String!
  lastname: String!
  email: String!
  authLevel: Int!
}

type Auth
  @join__type(graph: SERVICE_AUTH)
{
  accessToken: String!
}

type ComputedRoute
  @join__type(graph: GRAPH_SERVICE)
{
  distanceM: Float!
  durationS: Float!
  geometry: Geometry!
  steps: [Step!]!
}

input CoordinateInput
  @join__type(graph: GRAPH_SERVICE)
{
  lat: Float!
  lon: Float!
}

input CreateAdminUserInput
  @join__type(graph: SERVICE_ADMINUSER)
{
  firstname: String!
  lastname: String!
  email: String!
  password: String!
  authLevel: Int!
}

input CreateUserInput
  @join__type(graph: SERVICE_USER)
{
  googleId: ID!
  email: String
  age: Int
  pseudo: String
  photo: String
  role: String
  created_at: DateTime
  updated_at: DateTime
}

"""Date with time (isoformat)"""
scalar DateTime
  @join__type(graph: GRAPH_SERVICE)
  @join__type(graph: SERVICE_USER)

type EdgeDTO
  @join__type(graph: GRAPH_SERVICE)
{
  edgeId: String!
  sourceId: String!
  targetId: String!
  weight: Float!
  length: Float!
  layer: Int!
  name: String
}

input FrictionUpdateDTO
  @join__type(graph: GRAPH_SERVICE)
{
  tileId: String!
  frictionCoefficient: Float!
  sourceEvent: String!
}

type FrontStepDTO
  @join__type(graph: GRAPH_SERVICE)
{
  instruction: String!
  distanceM: Float!
  durationS: Float!
}

type Geometry
  @join__type(graph: GRAPH_SERVICE)
{
  coordinates: [[Float!]!]!
  type: String!
}

type GetUserResponse
  @join__type(graph: SERVICE_USER)
{
  googleId: ID!
  email: String
  age: Int
  pseudo: String
  photo: String
  role: String
  notificationChannelsDisabled: [String!]
  created_at: DateTime
  updated_at: DateTime
}

type ItineraryResultDTO
  @join__type(graph: GRAPH_SERVICE)
{
  distanceM: Float!
  durationS: Float!
  geometry: Geometry!
  steps: [FrontStepDTO!]!
  segments: [PathSegmentDTO!]!
  graphSnapshot: RoutingGraphSnapshot!
  traffic: TrafficInfoDTO!
}

input join__ContextArgument {
  name: String!
  type: String!
  context: String!
  selection: join__FieldValue!
}

scalar join__DirectiveArguments

scalar join__FieldSet

scalar join__FieldValue

enum join__Graph {
  GRAPH_SERVICE @join__graph(name: "graph-service", url: "http://ms-graph-manager:3011/graphql")
  SERVICE_ADMINUSER @join__graph(name: "service-adminuser", url: "http://service-adminuser:3003/graphql")
  SERVICE_AUTH @join__graph(name: "service-auth", url: "http://service-auth:3004/graphql")
  SERVICE_NOTIFICATIONS @join__graph(name: "service-notifications", url: "http://service-notifications:3008/graphql")
  SERVICE_USER @join__graph(name: "service-user", url: "http://service-user:3001/graphql")
}

scalar link__Import

enum link__Purpose {
  """
  `SECURITY` features provide metadata necessary to securely resolve fields.
  """
  SECURITY

  """
  `EXECUTION` features provide metadata necessary for operation execution.
  """
  EXECUTION
}

type Mutation
  @join__type(graph: SERVICE_ADMINUSER)
  @join__type(graph: SERVICE_AUTH)
  @join__type(graph: SERVICE_NOTIFICATIONS)
  @join__type(graph: SERVICE_USER)
{
  createAdminUser(createAdminUserInput: CreateAdminUserInput!): AdminUser! @join__field(graph: SERVICE_ADMINUSER)
  updateAdminUser(updateAdminUserInput: UpdateAdminUserInput!): AdminUser @join__field(graph: SERVICE_ADMINUSER)
  removeAdminUser(id: ID!): AdminUser @join__field(graph: SERVICE_ADMINUSER)
  loginWithGoogle(idToken: String!): Auth! @join__field(graph: SERVICE_AUTH)
  loginAdmin(email: String!, password: String!): Auth! @join__field(graph: SERVICE_AUTH)
  createNotification(userId: ID!, content: String!, channels: [String!]): Notification! @join__field(graph: SERVICE_NOTIFICATIONS)
  markNotificationAsRead(id: ID!): Notification! @join__field(graph: SERVICE_NOTIFICATIONS)
  createUser(createUserInput: CreateUserInput!): GetUserResponse! @inaccessible @join__field(graph: SERVICE_USER)
  updateUser(updateUserInput: UpdateUserInput!): String! @join__field(graph: SERVICE_USER)
  removeUser: String! @join__field(graph: SERVICE_USER)
  updateNotificationPreferences(disabledChannels: [String!]!): GetUserResponse! @join__field(graph: SERVICE_USER)
}

type NodeDTO
  @join__type(graph: GRAPH_SERVICE)
{
  id: String!
  lat: Float!
  lon: Float!
  isTransitStop: Boolean!
}

type Notification
  @join__type(graph: SERVICE_NOTIFICATIONS)
{
  id: ID!
  userId: String!
  content: String!
  type: String!
  source: String!
  triggeredBy: String
  isRead: Boolean!
  createdAt: String!
}

type PathSegmentDTO
  @join__type(graph: GRAPH_SERVICE)
{
  type: String!
  osmIds: [Int!]!
  transitLineId: String
  expectedArrival: DateTime
}

type Query
  @join__type(graph: GRAPH_SERVICE)
  @join__type(graph: SERVICE_ADMINUSER)
  @join__type(graph: SERVICE_AUTH)
  @join__type(graph: SERVICE_NOTIFICATIONS)
  @join__type(graph: SERVICE_USER)
{
  computeRoute(fromLat: Float!, fromLon: Float!, toLat: Float!, toLon: Float!): ComputedRoute @join__field(graph: GRAPH_SERVICE)
  infoTrafic(fromLat: Float!, fromLon: Float!, toLat: Float!, toLon: Float!): TrafficInfoDTO! @join__field(graph: GRAPH_SERVICE)
  getItineraireFromTo(request: RouteRequestDTO!, frictionUpdates: [FrictionUpdateDTO!] = null): ItineraryResultDTO @join__field(graph: GRAPH_SERVICE)
  adminUsers: [AdminUser!]! @join__field(graph: SERVICE_ADMINUSER)
  adminUser(id: ID!): AdminUser @join__field(graph: SERVICE_ADMINUSER)
  byEmailAndPassword(email: String!, password: String!): AdminUser @join__field(graph: SERVICE_ADMINUSER)
  getAllNotifications: [Notification]! @join__field(graph: SERVICE_NOTIFICATIONS)
  getMe: GetUserResponse! @join__field(graph: SERVICE_USER)
  getOne: GetUserResponse! @join__field(graph: SERVICE_USER)
  findAll: [GetUserResponse!]! @join__field(graph: SERVICE_USER)
  findOne(googleId: String!): GetUserResponse! @join__field(graph: SERVICE_USER)
}

input RouteRequestDTO
  @join__type(graph: GRAPH_SERVICE)
{
  startPoint: CoordinateInput!
  endPoint: CoordinateInput!
  departureTime: DateTime!
  routingProfile: String! = "driving"
}

type RoutingGraphSnapshot
  @join__type(graph: GRAPH_SERVICE)
{
  nodes: [NodeDTO!]!
  edges: [EdgeDTO!]!
}

type Step
  @join__type(graph: GRAPH_SERVICE)
{
  distance: Float!
  duration: Float!
  name: String
}

type TrafficInfoDTO
  @join__type(graph: GRAPH_SERVICE)
{
  realtimeFactor: Float!
  predictiveFactor: Float!
  source: String!
}

input UpdateAdminUserInput
  @join__type(graph: SERVICE_ADMINUSER)
{
  id: ID!
  firstname: String
  lastname: String
  email: String
  password: String
  authLevel: Int
}

input UpdateUserInput
  @join__type(graph: SERVICE_USER)
{
  email: String
  age: Int
  pseudo: String
  photo: String
  updated_at: DateTime
}

type User
  @join__type(graph: SERVICE_NOTIFICATIONS, key: "id")
{
  id: ID!
  notifications: [Notification]
}