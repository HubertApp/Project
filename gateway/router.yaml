cors:
  origins:
      - https://localhost
      - capacitor://localhost
      - http://localhost:5173
      - https://studio.apollographql.com

  # Test depuis un téléphone sur le même réseau : l'origine de la page devient
  # http://<IP-LAN>:5173, que la liste ci-dessus ne couvre pas. Le motif évite
  # de rééditer ce fichier à chaque renouvellement de bail DHCP.
  # (Réseaux privés uniquement — 192.168.x.x et le range Tailscale 100.x.x.x.)
  match_origins:
      - "^http://192\\.168\\.\\d{1,3}\\.\\d{1,3}:5173$"
      - "^http://100\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}:5173$"

  allow_credentials: true

rhai:
  scripts: /gateway/scripts/
  main: main.rhai


headers:
  all:
    request:
      - propagate:
          named: x-user-id
      - propagate:
          named: x-user-role
      - propagate:
          named: x-user-email
      - propagate:
          named: x-user-pseudo
      - propagate:
          named: x-user-age
      - propagate:
          named: x-auth-state

# authentication:
#   router:
#     jwt:
#       jwks:
#         - url: "http://service-auth:3007/auth/jwks"
      
#       on_error: Continue

#       sources:
#         - type: cookie
#           name: jwt

include_subgraph_errors:
  all: true

telemetry:
  exporters:
    metrics:
      otlp:
        enabled: true
        endpoint: "http://otel-collector:4317"
        protocol: grpc
        batch_processor:
          scheduled_delay: 100ms
          max_concurrent_exports: 1000
          max_export_batch_size: 10000
          max_export_timeout: 100s
          max_queue_size: 10000

supergraph:
  listen: 0.0.0.0:4000
  introspection: true

sandbox:
  enabled: true

homepage:
  enabled: false