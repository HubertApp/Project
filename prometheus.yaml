global:
  scrape_interval: 15s

scrape_configs:
  - job_name: otel-collector
    honor_labels: true 
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: astar-envoy
    metrics_path: /stats/prometheus
    static_configs:
      - targets: ['astar_envoy:9901']
        labels:
          service: itinerary-creator

  - job_name: rabbitmq
    static_configs:
      - targets: ['rabbitmq-container:15692']